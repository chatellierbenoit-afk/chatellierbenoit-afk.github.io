name: Mise à jour des données

on:
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Générer les fichiers de données
        run: python build_data.py

      - name: Afficher les fichiers générés
        run: |
          echo "=== contenu de data ==="
          find data -maxdepth 4 -type f | sort || true

      - name: Commit et push des données
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/current/ || true

          git diff --cached --quiet && echo "Aucun changement à commit" || git commit -m "Mise à jour automatique des données"
          git push
