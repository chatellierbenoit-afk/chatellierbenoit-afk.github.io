name: Mise à jour des données

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Générer les fichiers de données
        run: python build_data.py

      - name: Corriger et auditer les données
        run: python postprocess_data.py

      - name: Générer le sitemap et robots.txt
        run: python build_sitemap.py

      - name: Vérifier sitemap et robots
        run: |
          echo "=== robots.txt ==="
          cat robots.txt

          echo ""
          echo "=== sitemap.xml ==="
          ls -lh sitemap.xml

          echo ""
          echo "=== nombre d'URL ==="
          grep -c "<url>" sitemap.xml

      - name: Commit et push des fichiers générés
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/current/
          git add sitemap.xml
          git add robots.txt

          if git diff --cached --quiet; then
            echo "Aucun changement à commit"
            exit 0
          fi

          git commit -m "Mise à jour automatique des données et du sitemap"
          git pull --rebase origin main
          git push origin main
