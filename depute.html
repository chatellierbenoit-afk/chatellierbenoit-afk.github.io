<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Député</title>
<style>
body { font-family:Arial; padding:30px; background:#f5f5f5; }
.card { background:white; padding:20px; border-radius:10px; }
</style>
</head>

<body>

<div id="content"></div>

<script>
function getParam(name){
  return new URLSearchParams(window.location.search).get(name);
}

async function init(){
  const deputes = await fetch("data/current/deputes.json").then(r=>r.json()).then(d=>d.deputes);

  const uid = getParam("uid");

  const d = deputes.find(x=>x.uid === uid);

  if(!d){
    document.getElementById("content").innerHTML = "Introuvable";
    return;
  }

  document.getElementById("content").innerHTML = `
    <div class="card">
      <h1>${d.nom}</h1>
      <p><strong>Groupe :</strong> ${d.groupe}</p>
      <p><strong>Département :</strong> ${d.departement}</p>
      <p><strong>Circonscription :</strong> ${d.circonscription}</p>
      <p><strong>Votes :</strong> ${d.votes_count}</p>
    </div>
  `;
}

init();
</script>

</body>
</html>
