<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fiche scrutin</title>
  <style>
    :root {
      --violet: #7700FF;
      --violet-dark: #5b00c7;
      --violet-soft: #f3edff;
      --card: #ffffff;
      --text: #1e1c26;
      --muted: #6f6a7e;
      --border: #e7e2f2;
      --shadow: 0 12px 28px rgba(57, 22, 119, 0.08);
      --radius: 22px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(180deg, #f8f6fd 0%, #f3f0fb 100%);
      color: var(--text);
    }

    .hero {
      background: linear-gradient(135deg, var(--violet-dark), var(--violet));
      color: white;
      text-align: center;
      padding: 36px 20px 30px;
      box-shadow: 0 12px 30px rgba(90, 0, 199, 0.18);
    }

    .top-links {
      max-width: 1480px;
      margin: 18px auto 0;
      padding: 0 16px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .top-links a {
      display: inline-block;
      text-decoration: none;
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.35);
      color: white;
      font-weight: 700;
      background: rgba(255,255,255,0.08);
    }

    .hero h1 {
      margin: 0;
      font-size: 40px;
      line-height: 1.12;
    }

    .hero p {
      margin: 12px auto 0;
      font-size: 17px;
      max-width: 980px;
      line-height: 1.45;
      opacity: 0.98;
    }

    main {
      max-width: 1480px;
      margin: 0 auto;
      padding: 24px 16px 52px;
    }

    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 24px;
      margin-bottom: 20px;
    }

    .year-switch {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .year-btn {
      display: inline-block;
      min-width: 120px;
      text-align: center;
      padding: 14px 18px;
      border-radius: 14px;
      border: 1px solid #d9d2ea;
      background: white;
      color: #1e1c26;
      text-decoration: none;
      font-weight: 700;
    }

    .year-btn.active {
      background: linear-gradient(135deg, #5b00c7, #7700FF);
      color: white;
      border-color: transparent;
    }

    .panel-title {
      margin: 0 0 18px;
      font-size: 30px;
      text-align: center;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1.05fr 0.95fr;
      gap: 18px;
    }

    .info-card,
    .stats-card {
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 22px;
      background: linear-gradient(180deg, #ffffff 0%, #fcfbff 100%);
    }

    .info-card h2,
    .stats-card h2 {
      margin: 0 0 14px;
      font-size: 34px;
      line-height: 1.15;
      text-align: center;
    }

    .meta-list {
      display: grid;
      gap: 10px;
      margin-top: 10px;
    }

    .meta-row {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: white;
    }

    .meta-row strong {
      font-size: 14px;
    }

    .meta-row span {
      color: var(--muted);
      text-align: right;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }

    .summary-box {
      background: white;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      text-align: center;
    }

    .summary-box strong {
      display: block;
      font-size: 24px;
      margin-bottom: 6px;
      color: var(--violet);
    }

    .summary-box span {
      color: var(--muted);
      font-size: 13px;
    }

    .small-muted {
      margin-top: 12px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
    }

    .filters {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
    }

    .field label {
      display: block;
      font-weight: 700;
      font-size: 14px;
      margin-bottom: 8px;
      text-align: center;
    }

    .field input,
    .field select {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid #d9d2ea;
      border-radius: 14px;
      font-size: 16px;
      background: white;
      text-align: center;
    }

    .votes-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
    }

    .vote-card {
      display: block;
      text-decoration: none;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px;
      background: linear-gradient(180deg, #ffffff 0%, #fcfbff 100%);
      transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
    }

    .vote-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 24px rgba(57, 22, 119, 0.10);
      background: var(--violet-soft);
    }

    .vote-card h3 {
      margin: 0 0 8px;
      text-align: center;
      font-size: 24px;
      line-height: 1.2;
    }

    .vote-card .meta {
      text-align: center;
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 8px;
    }

    .vote-badge {
      display: inline-block;
      margin: 0 auto 10px;
      padding: 8px 12px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      text-align: center;
    }

    .vote-badge-wrap {
      text-align: center;
    }

    .vote-pour {
      background: #e8fff1;
      color: #0a8f49;
      border: 1px solid #bce7cf;
    }

    .vote-contre {
      background: #fff0f0;
      color: #c53737;
      border: 1px solid #efc2c2;
    }

    .vote-abstention {
      background: #fff9e8;
      color: #9b7600;
      border: 1px solid #ead796;
    }

    .vote-non-votant {
      background: #f1f1f4;
      color: #666a73;
      border: 1px solid #d9dbe3;
    }

    .vote-card .sub {
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }

    .empty {
      text-align: center;
      color: var(--muted);
      padding: 28px 8px;
    }

    @media (max-width: 1200px) {
      .hero-grid,
      .summary-grid,
      .votes-grid,
      .filters {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 760px) {
      .hero-grid,
      .summary-grid,
      .votes-grid,
      .filters {
        grid-template-columns: 1fr;
      }

      .hero h1 { font-size: 31px; }
      main { padding: 18px 12px 36px; }
    }
  </style>
</head>
<body>
  <header class="hero">
    <div class="top-links">
      <a href="index.html">Accueil</a>
      <a id="backGroupLink" href="#" style="display:none;">Voir le groupe</a>
      <a id="backDeputyLink" href="#" style="display:none;">Voir le député</a>
    </div>
    <h1 id="pageTitle">Fiche scrutin</h1>
    <p id="pageSubtitle">Chargement…</p>
  </header>

  <main>
    <div class="panel year-switch" id="yearSwitch"></div>

    <section class="panel">
      <h2 class="panel-title">Résumé du scrutin</h2>
      <div class="hero-grid">
        <div class="info-card">
          <h2 id="scrutinTitleHeading">Chargement…</h2>
          <div class="meta-list">
            <div class="meta-row">
              <strong>Date</strong>
              <span id="scrutinDate">-</span>
            </div>
            <div class="meta-row">
              <strong>Thématique</strong>
              <span id="scrutinTheme">-</span>
            </div>
            <div class="meta-row">
              <strong>UID</strong>
              <span id="scrutinUid">-</span>
            </div>
            <div class="meta-row">
              <strong>Total des votes recensés</strong>
              <span id="scrutinVotesCount">0</span>
            </div>
          </div>
          <div class="small-muted" id="scrutinDescription">-</div>
        </div>

        <div class="stats-card">
          <h2>Répartition des votes</h2>
          <div class="summary-grid">
            <div class="summary-box"><strong id="scrutinPour">0</strong><span>Pour</span></div>
            <div class="summary-box"><strong id="scrutinContre">0</strong><span>Contre</span></div>
            <div class="summary-box"><strong id="scrutinAbstention">0</strong><span>Abstention</span></div>
            <div class="summary-box"><strong id="scrutinNonVotant">0</strong><span>Non-votant</span></div>
          </div>
          <div class="small-muted" id="scrutinStatsText">Chargement…</div>
        </div>
      </div>
    </section>

    <section class="panel">
      <div class="filters">
        <div class="field">
          <label for="voteFilter">Vote</label>
          <select id="voteFilter">
            <option value="">Tous les votes</option>
            <option value="Pour">Pour</option>
            <option value="Contre">Contre</option>
            <option value="Abstention">Abstention</option>
            <option value="Non-votant">Non-votant</option>
          </select>
        </div>

        <div class="field">
          <label for="groupFilter">Groupe</label>
          <select id="groupFilter">
            <option value="">Tous les groupes</option>
          </select>
        </div>

        <div class="field">
          <label for="departementFilter">Département</label>
          <select id="departementFilter">
            <option value="">Tous les départements</option>
          </select>
        </div>

        <div class="field">
          <label for="nameFilter">Nom du député</label>
          <input id="nameFilter" type="text" placeholder="Ex. Clouet, Panot, Ruffin">
        </div>
      </div>
    </section>

    <section class="panel">
      <h2 class="panel-title">Votes nominatif</h2>
      <div id="votesContainer" class="votes-grid"></div>
    </section>
  </main>

  <script>
    let selectedYear = "";
    let allScrutins = [];
    let scrutin = null;
    let scrutinUid = "";

    function getParam(name) {
      return new URLSearchParams(window.location.search).get(name) || "";
    }

    function setParamInUrl(url, key, value) {
      const u = new URL(url, window.location.origin);
      if (value) u.searchParams.set(key, value);
      else u.searchParams.delete(key);
      return u.pathname + u.search;
    }

    function buildYearButtons(indexData) {
      const container = document.getElementById("yearSwitch");
      const years = (indexData?.available_years || []).map(String);
      const currentUrl = window.location.pathname + window.location.search;

      container.innerHTML = years.map(year => {
        const href = setParamInUrl(currentUrl, "year", year);
        const active = selectedYear === year ? "active" : "";
        return `<a class="year-btn ${active}" href="${href}">${year}</a>`;
      }).join("");
    }

    function getSelectedYear(indexData) {
      const yearParam = getParam("year");
      const availableYears = (indexData?.available_years || []).map(String);
      const defaultYear = String(indexData?.default_year || "");
      if (yearParam && availableYears.includes(yearParam)) return yearParam;
      if (defaultYear && availableYears.includes(defaultYear)) return defaultYear;
      return availableYears[0] || "";
    }

    async function loadJson(path) {
      const response = await fetch(path);
      if (!response.ok) throw new Error(`Impossible de charger ${path}`);
      return response.json();
    }

    async function loadMonthFile(filePath) {
      return loadJson("./" + filePath);
    }

    async function loadYearScrutins(indexData) {
      selectedYear = getSelectedYear(indexData);
      const yearInfo = indexData?.years?.[selectedYear];
      const months = yearInfo?.months || [];
      const payloads = await Promise.all(months.map(m => loadMonthFile(m.file)));
      return payloads.flatMap(payload => payload.scrutins || []);
    }

    function formatNumber(value) {
      return new Intl.NumberFormat("fr-FR").format(value || 0);
    }

    function normalize(text) {
      return (text || "")
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "");
    }

    function ensureArray(v) {
      return Array.isArray(v) ? v : [];
    }

    function computeStats(votes) {
      return {
        pour: votes.filter(v => v.vote === "Pour").length,
        contre: votes.filter(v => v.vote === "Contre").length,
        abstention: votes.filter(v => v.vote === "Abstention").length,
        non_votant: votes.filter(v => v.vote === "Non-votant").length,
      };
    }

    function shortTitle(scrutin) {
      const title = (scrutin.titre || "").trim();
      const mSous = title.match(/(sous-amendement n°\s*\d+)/i);
      const mAmend = title.match(/(amendement n°\s*\d+)/i);
      const mArticle = title.match(/(article\s+[0-9a-zàâçéèêëîïôûùüÿñæœ\- ]+)/i);

      if (mSous && mArticle) return `${mSous[1]} sur ${mArticle[1]}`;
      if (mSous) return mSous[1];
      if (mAmend && mArticle) return `${mAmend[1]} sur ${mArticle[1]}`;
      if (mAmend) return mAmend[1];
      if (mArticle) return `Vote sur l’article ${mArticle[1].trim()}`;

      if (title.length > 140) return title.slice(0, 137).trim() + "…";
      return title || "Scrutin sans titre";
    }

    function getVoteBadgeClass(vote) {
      if (vote === "Pour") return "vote-pour";
      if (vote === "Contre") return "vote-contre";
      if (vote === "Abstention") return "vote-abstention";
      return "vote-non-votant";
    }

    function renderFilters() {
      const groups = [...new Set(ensureArray(scrutin?.votes).map(v => v.groupe).filter(Boolean))]
        .sort((a, b) => a.localeCompare(b, "fr"));

      const departements = [...new Set(ensureArray(scrutin?.votes).map(v => v.departement).filter(Boolean))]
        .sort((a, b) => a.localeCompare(b, "fr"));

      const groupSelect = document.getElementById("groupFilter");
      const depSelect = document.getElementById("departementFilter");

      groupSelect.innerHTML = `<option value="">Tous les groupes</option>`;
      depSelect.innerHTML = `<option value="">Tous les départements</option>`;

      groups.forEach(group => {
        const option = document.createElement("option");
        option.value = group;
        option.textContent = group;
        groupSelect.appendChild(option);
      });

      departements.forEach(dep => {
        const option = document.createElement("option");
        option.value = dep;
        option.textContent = dep;
        depSelect.appendChild(option);
      });
    }

    function renderHeader() {
      const votes = ensureArray(scrutin?.votes);
      const stats = computeStats(votes);

      document.getElementById("pageTitle").textContent = shortTitle(scrutin);
      document.getElementById("pageSubtitle").textContent =
        `${formatNumber(votes.length)} votes recensés · ${scrutin?.date || "-"} · ${scrutin?.theme || "Autres"}`;

      document.getElementById("scrutinTitleHeading").textContent = shortTitle(scrutin);
      document.getElementById("scrutinDate").textContent = scrutin?.date || "-";
      document.getElementById("scrutinTheme").textContent = scrutin?.theme || "Autres";
      document.getElementById("scrutinUid").textContent = scrutin?.uid || "-";
      document.getElementById("scrutinVotesCount").textContent = formatNumber(votes.length);
      document.getElementById("scrutinDescription").textContent = scrutin?.description || scrutin?.titre || "-";

      document.getElementById("scrutinPour").textContent = formatNumber(stats.pour);
      document.getElementById("scrutinContre").textContent = formatNumber(stats.contre);
      document.getElementById("scrutinAbstention").textContent = formatNumber(stats.abstention);
      document.getElementById("scrutinNonVotant").textContent = formatNumber(stats.non_votant);

      document.getElementById("scrutinStatsText").textContent =
        `${formatNumber(votes.length)} votes observés : ${formatNumber(stats.pour)} Pour, ${formatNumber(stats.contre)} Contre, ${formatNumber(stats.abstention)} Abstentions, ${formatNumber(stats.non_votant)} Non-votants.`;
    }

    function renderVotes() {
      const voteType = document.getElementById("voteFilter").value;
      const group = document.getElementById("groupFilter").value;
      const departement = document.getElementById("departementFilter").value;
      const nameQuery = normalize(document.getElementById("nameFilter").value);

      const filtered = ensureArray(scrutin?.votes).filter(v => {
        const voteMatch = !voteType || v.vote === voteType;
        const groupMatch = !group || v.groupe === group;
        const depMatch = !departement || v.departement === departement;
        const nameMatch = !nameQuery || normalize(v.nom || "").includes(nameQuery);
        return voteMatch && groupMatch && depMatch && nameMatch;
      });

      const container = document.getElementById("votesContainer");

      if (!filtered.length) {
        container.innerHTML = `<div class="empty">Aucun vote nominatif ne correspond aux filtres choisis.</div>`;
        return;
      }

      container.innerHTML = filtered
        .sort((a, b) => (a.nom || "").localeCompare(b.nom || "", "fr"))
        .map(v => `
          <a class="vote-card" href="depute.html?uid=${encodeURIComponent(v.depute_uid)}&year=${encodeURIComponent(selectedYear)}">
            <h3>${v.nom || "-"}</h3>
            <div class="vote-badge-wrap">
              <span class="vote-badge ${getVoteBadgeClass(v.vote)}">${v.vote || "-"}</span>
            </div>
            <div class="meta">${v.groupe || "-"}</div>
            <div class="meta">${v.circonscription || v.departement || "-"}</div>
            <div class="sub">${v.departement || "-"}</div>
          </a>
        `).join("");
    }

    function bindFilters() {
      ["voteFilter", "groupFilter", "departementFilter", "nameFilter"].forEach(id => {
        const el = document.getElementById(id);
        el.addEventListener("input", renderVotes);
        el.addEventListener("change", renderVotes);
      });
    }

    async function init() {
      try {
        scrutinUid = getParam("uid");

        if (!scrutinUid) {
          document.querySelector("main").innerHTML =
            `<section class="panel"><div class="empty">UID scrutin manquant.</div></section>`;
          return;
        }

        const indexData = await loadJson("./data/current/index.json");
        selectedYear = getSelectedYear(indexData);
        buildYearButtons(indexData);

        allScrutins = await loadYearScrutins(indexData);
        scrutin = allScrutins.find(s => s.uid === scrutinUid);

        if (!scrutin) {
          document.querySelector("main").innerHTML =
            `<section class="panel"><div class="empty">Scrutin introuvable pour cette année.</div></section>`;
          return;
        }

        renderHeader();
        renderFilters();
        renderVotes();
        bindFilters();
      } catch (error) {
        console.error(error);
        document.querySelector("main").innerHTML =
          `<section class="panel"><div class="empty">Erreur de chargement des données.</div></section>`;
      }
    }

    init();
  </script>
</body>
</html>
