<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Députés</title>

<style>
body { font-family: Arial; padding: 40px; background:#f5f5f5; }
input { padding:10px; width:300px; }
button { padding:10px; background:#7700FF; color:white; border:none; }
.grid { display:grid; grid-template-columns:repeat(3,1fr); gap:20px; margin-top:30px;}
.card { background:white; padding:20px; border-radius:10px; }
</style>
</head>

<body>

<h1>Trouver un député</h1>

<input id="search" placeholder="Ville, code postal, nom...">
<button onclick="search()">Rechercher</button>

<div id="results" class="grid"></div>

<script>
let deputes = [];
let votes = [];
let circoData = {};

function normalize(text){
  return (text||"")
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"");
}

async function load(){
  deputes = (await fetch("./data/current/deputes.json")).then(r=>r.json()).then(d=>d.deputes);
  votes = (await fetch("./data/current/index.json")).then(r=>r.json());
  circoData = await fetch("./data/circos_officiel.json").then(r=>r.json());
}

async function resolveGeo(query){

  // CODE POSTAL
  if(/^\d{5}$/.test(query)){
    const res = await fetch(`https://geo.api.gouv.fr/communes?codePostal=${query}&fields=nom,code,departement`);
    const data = await res.json();

    if(data.length){
      return {
        code: data[0].code,
        departement: data[0].departement.nom,
        commune: data[0].nom
      }
    }
  }

  // VILLE
  const res = await fetch(`https://geo.api.gouv.fr/communes?nom=${query}&limit=1&fields=nom,code,departement`);
  const data = await res.json();

  if(data.length){
    return {
      code: data[0].code,
      departement: data[0].departement.nom,
      commune: data[0].nom
    }
  }

  return null;
}

function getVotesCount(uid){

  Object.values(votes.years || {}).forEach(y=>{
    (y.months||[]).forEach(m=>{

    })
  });

  return count;
}

async function search(){

  const q = document.getElementById("search").value.trim();
  const nq = normalize(q);

  let results = [...deputes];

  let geo = null;

  try{
    geo = await resolveGeo(q);
  }catch(e){}

  // 🔥 MATCH EXACT CIRCO
  if(geo){
    const circo = circoData[geo.code];

    if(circo){
      results = results.filter(d =>
        normalize(d.departement) === normalize(geo.departement) &&
        normalize(d.circonscription).includes(normalize(circo))
      );
    }else{
      // fallback département
      results = results.filter(d =>
        normalize(d.departement) === normalize(geo.departement)
      );
    }
  }

  // 🔥 MODE GOOGLE TEXTE
  if(nq){
    results = results.filter(d=>{
      const txt = [
        d.nom,
        d.groupe,
        d.departement,
        d.circonscription
      ].map(normalize).join(" ");

      return txt.includes(nq);
    });
  }

  results = results.slice(0,12);

  document.getElementById("results").innerHTML =
    results.map(d=>`
      <div class="card">
        <h3>${d.nom}</h3>
        <p>${d.departement}</p>
        <p>${d.circonscription}</p>
      </div>
    `).join("") || "Aucun résultat";
}

load();
</script>

</body>
</html>
