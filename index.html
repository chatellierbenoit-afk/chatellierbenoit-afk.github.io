<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comment vote votre député ?</title>

<style>
body {
  margin:0;
  font-family:Arial, sans-serif;
  background:#f6f3fb;
}

.hero {
  background:#7700FF;
  color:white;
  text-align:center;
  padding:40px;
}

.container {
  max-width:1200px;
  margin:auto;
  padding:20px;
}

.card {
  background:white;
  border-radius:16px;
  padding:20px;
  margin-bottom:20px;
}

.grid {
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
}

.result {
  border:1px solid #ddd;
  padding:15px;
  border-radius:10px;
  text-align:center;
  cursor:pointer;
}

.result:hover {
  background:#f3edff;
}

input {
  width:100%;
  padding:15px;
  border-radius:10px;
  border:1px solid #ccc;
  font-size:16px;
}

button {
  margin-top:10px;
  padding:15px;
  width:100%;
  background:#7700FF;
  color:white;
  border:none;
  border-radius:10px;
  font-size:16px;
  cursor:pointer;
}

#mapWrap {
  max-width:800px;
  margin:auto;
}

#franceMap path {
  stroke:#fff;
  stroke-width:1;
  cursor:pointer;
  transition:all .2s;
}

#franceMap path:hover {
  opacity:.8;
}
</style>
</head>

<body>

<div class="hero">
  <h1>Comment vote votre député ?</h1>
</div>

<div class="container">

  <!-- SEARCH -->
  <div class="card">
    <input id="search" placeholder="Ville, code postal, département, nom…">
    <button onclick="search()">Rechercher</button>
  </div>

  <!-- RESULTS -->
  <div class="card">
    <div id="results" class="grid"></div>
  </div>

  <!-- MAP -->
  <div class="card">
    <h2>Carte politique</h2>
    <div id="mapWrap">
      <svg id="franceMap" viewBox="0 0 1000 1000"></svg>
    </div>
  </div>

</div>

<script>

let deputes = [];
let scrutins = [];
let votesFlat = [];
let circoMap = {};

function normalize(t){
  return (t||"").toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"");
}

function format(n){
  return new Intl.NumberFormat("fr-FR").format(n||0);
}

async function load(){
  const index = await fetch("./data/current/index.json").then(r=>r.json());

  const months = index.years[index.default_year].months;

  for(let m of months){
    const data = await fetch("./"+m.file).then(r=>r.json());
    scrutins = scrutins.concat(data.scrutins);
  }

  deputes = (await fetch("./data/current/deputes.json").then(r=>r.json())).deputes;
  circoMap = await fetch("./data/current/circonscriptions.json").then(r=>r.json());

  buildVotes();
  renderMap();
  search();
}

function buildVotes(){
  votesFlat = [];
  scrutins.forEach(s=>{
    (s.votes||[]).forEach(v=>{
      votesFlat.push(v);
    });
  });
}

function getDeputes(){
  const map = new Map();

  votesFlat.forEach(v=>{
    if(!map.has(v.depute_uid)){
      const d = deputes.find(x=>x.uid===v.depute_uid);

      map.set(v.depute_uid,{
        uid:v.depute_uid,
        nom:d?.nom||v.nom,
        departement:d?.departement||"",
        circonscription:d?.circonscription||"",
        groupe:v.groupe,
        count:0
      });
    }
    map.get(v.depute_uid).count++;
  });

  return [...map.values()];
}

function fuzzy(text,query){
  return text.includes(query) ||
    query.split(" ").every(w=>text.includes(w));
}

async function search(){

  const input = document.getElementById("search").value.trim();
  const q = normalize(input);

  let circoMatches = [];

  if(/^\d{5}$/.test(input) && circoMap[input]){
    circoMatches = circoMap[input];
  }

  const res = getDeputes().filter(d=>{

    const hay = [
      d.nom,
      d.departement,
      d.circonscription,
      d.groupe
    ].map(normalize);

    const textMatch = hay.some(v=>fuzzy(v,q));

    const circoMatch = circoMatches.some(c =>
      normalize(d.departement).includes(normalize(c.departement)) &&
      normalize(d.circonscription).includes(normalize(c.circonscription))
    );

    return textMatch || circoMatch;
  }).slice(0,40);

  document.getElementById("results").innerHTML =
    res.map(d=>`
      <div class="result" onclick="go('${d.uid}')">
        <h3>${d.nom}</h3>
        <p>${d.circonscription}</p>
        <strong>${format(d.count)} votes</strong>
      </div>
    `).join("") || "Aucun résultat";
}

function go(uid){
  window.location = `depute.html?uid=${uid}`;
}

async function renderMap(){

  const geo = await fetch(
    "https://france-geojson.gregoiredavid.fr/repo/departements.geojson"
  ).then(r=>r.json());

  const svg = document.getElementById("franceMap");

  function project([lon,lat]){
    return [(lon+5)*80,(51-lat)*80];
  }

  function path(coords){
    return coords.map(r =>
      r.map((p,i)=>{
        const [x,y]=project(p);
        return (i?"L":"M")+x+" "+y;
      }).join(" ")+" Z"
    ).join(" ");
  }

  const stats={};

  votesFlat.forEach(v=>{
    if(!v.departement) return;
    stats[v.departement]=stats[v.departement]||{};
    stats[v.departement][v.groupe]=(stats[v.departement][v.groupe]||0)+1;
  });

  function dominant(dep){
    const g=stats[dep];
    if(!g) return null;
    return Object.entries(g).sort((a,b)=>b[1]-a[1])[0][0];
  }

  const colors={
    "Rassemblement National":"#002395",
    "La France insoumise - Nouveau Front Populaire":"#ff0000",
    "Écologiste et Social":"#00a86b",
    "Ensemble pour la République":"#f5c542"
  };

  svg.innerHTML = geo.features.map(f=>{

    const dep = f.properties.nom;
    const g = dominant(dep);
    const col = colors[g] || "#ccc";

    let d="";
    if(f.geometry.type==="Polygon"){
      d = path(f.geometry.coordinates);
    }else{
      d = f.geometry.coordinates.map(p=>path(p)).join(" ");
    }

    return `<path d="${d}" fill="${col}" data="${dep}"/>`;
  }).join("");

  document.querySelectorAll("#franceMap path").forEach(el=>{
    el.onclick = ()=>{
      document.getElementById("search").value = el.getAttribute("data");
      search();
    };
  });
}

load();

</script>

</body>
</html>
