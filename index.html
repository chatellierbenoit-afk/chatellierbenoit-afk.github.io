<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Assemblée</title>

<style>
body { font-family: Arial; background:#f5f5f5; padding:30px; }
input { padding:12px; width:300px; }
button { padding:12px; background:#7700FF; color:white; border:none; cursor:pointer; }

.grid {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
  margin-top:20px;
}

.card {
  background:white;
  padding:20px;
  border-radius:12px;
}
</style>
</head>

<body>

<h1>Députés</h1>

<input id="search" placeholder="Nom, ville, code postal">
<button onclick="search()">Rechercher</button>

<h2>Composition de l’Assemblée</h2>
<div id="composition" class="grid"></div>

<h2>Résultats</h2>
<div id="results" class="grid"></div>

<script>
let deputes = [];
let composition = [];

function normalize(t){
  return (t||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
}

async function init(){
  deputes = await fetch("data/current/deputes.json").then(r=>r.json()).then(d=>d.deputes);
  composition = await fetch("data/current/composition.json").then(r=>r.json()).then(d=>d.groupes);

  renderComposition();
}

function renderComposition(){
  document.getElementById("composition").innerHTML =
    composition.map(g=>`
      <div class="card">
        <h3>${g.groupe}</h3>
        <strong>${g.count}</strong>
        <p>${g.pct}%</p>
      </div>
    `).join("");
}

function search(){
  const q = normalize(document.getElementById("search").value);

  const results = deputes.filter(d=>{
    const txt = normalize(d.nom + " " + d.departement + " " + d.circonscription);
    return txt.includes(q);
  }).slice(0,12);

  document.getElementById("results").innerHTML =
    results.map(d=>`
      <div class="card">
        <h3>${d.nom}</h3>
        <p>${d.departement}</p>
        <p>${d.circonscription}</p>
      </div>
    `).join("") || "Aucun résultat";
}

init();
</script>

</body>
</html>
