<script>
async function searchDeputies() {
  const rawQuery = document.getElementById("deputeSearchInput").value.trim();
  const query = normalize(rawQuery);

  let geo = null;
  try {
    geo = await resolveGeoQuery(rawQuery);
  } catch (e) {
    console.warn("Erreur geo API", e);
  }

  const expandedQueries = [query];

  // 🔥 enrichissement avec données geo
  if (geo) {
    if (geo.commune) expandedQueries.push(normalize(geo.commune));
    if (geo.departement) expandedQueries.push(normalize(geo.departement));
    if (geo.departementCode) expandedQueries.push(normalize(geo.departementCode));
  }

  const results = getSearchableDeputies()
    .filter(d => {
      if (!query) return true;

      const haystacks = [
        d.nom,
        d.groupe,
        d.circonscription,
        d.departement,

        // 🔥 AJOUT CRITIQUE
        geo?.departement,
        geo?.departementCode
      ]
      .filter(Boolean)
      .map(normalize);

      return expandedQueries.some(q =>
        q && haystacks.some(value => value.includes(q))
      );
    })
    .slice(0, 40);

  const html = results.map(d => `
    <a class="card-link" href="depute.html?uid=${encodeURIComponent(d.uid)}&year=${encodeURIComponent(selectedYear)}">
      <h3>${d.nom}</h3>
      <div class="meta">${d.circonscription || d.departement || "-"}</div>
      <span class="big">${formatNumber(d.votes_count)}</span>
      <div class="sub">votes recensés</div>
    </a>
  `).join("");

  document.getElementById("deputeSearchResults").innerHTML =
    html || `<div class="empty">Aucun député trouvé.</div>`;
}
</script>
