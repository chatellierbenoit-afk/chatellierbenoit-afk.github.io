<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Groupe</title>
<style>
body { font-family:Arial; padding:30px; background:#f5f5f5; }
.grid { display:grid; grid-template-columns:repeat(3,1fr); gap:20px; }
.card { background:white; padding:20px; border-radius:10px; }
</style>
</head>

<body>

<h1 id="title"></h1>

<div id="list" class="grid"></div>

<script>
function getParam(name){
  return new URLSearchParams(window.location.search).get(name);
}

let deputes = [];

async function init(){
  deputes = await fetch("data/current/deputes.json").then(r=>r.json()).then(d=>d.deputes);

  const groupe = getParam("name");
  document.getElementById("title").textContent = groupe;

  const list = deputes.filter(d=>d.groupe === groupe);

  document.getElementById("list").innerHTML =
    list.map(d=>`
      <div class="card">
        <h3>${d.nom}</h3>
        <p>${d.departement}</p>
        <p>${d.circonscription}</p>
      </div>
    `).join("");
}

init();
</script>

</body>
</html>
